name: waf-lint
description: Construit l'image de base depuis le source de waf-base au SHA de l'action, puis le dossier waf/ d'une app, ce qui rejoue wafgen check (formes, rendu, caddy validate, attaque canonique).
inputs:
  waf-dir:
    description: Dossier des règles de l'app
    default: waf
runs:
  using: composite
  steps:
    # Le paquet GHCR est privé : la base est reconstruite depuis le dépôt de l'action,
    # que le runner a déjà téléchargé au SHA épinglé par la startup.
    - shell: bash
      env:
        WAF_DIR: ${{ inputs.waf-dir }}
        BASE_DIR: ${{ github.action_path }}/..
      run: |
        if ! printf '%s' "$WAF_DIR" | grep -Eqx 'waf(/[a-z0-9-]{1,64})?'; then echo "waf-dir invalide"; exit 1; fi
        docker build --quiet -t waf-base:lint "$BASE_DIR"
        docker build --build-arg WAF_BASE=waf-base:lint --no-cache --progress plain "$WAF_DIR"
