SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
# SecRuleRemoveById ne retire que les règles déjà chargées : celle-ci reste hors de portée du tenant.
# Seuil codé en dur, sans %{tx...}, pour ne dépendre d'aucune variable modifiable.
SecRule TX:BLOCKING_INBOUND_ANOMALY_SCORE "@ge 5" \
    "id:19110,phase:2,deny,status:403,log,t:none,\
    msg:'Garde-fou ADEME : score entrant %{TX.BLOCKING_INBOUND_ANOMALY_SCORE}',\
    tag:'ademe-obligatoire'"
