name: release
on:
  push:
    branches: [main]
    paths-ignore:
      - inventaire.yaml
      - "**/*.md"
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/incubateur-ademe/waf-base
  SIGNER: incubateur-ademe/waf-base/.github/workflows/release.yml
jobs:
  build:
    runs-on: ubuntu-24.04
    environment: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.main.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build de l'image sur l'arbre du commit, avant tout test
        env:
          SHA: ${{ github.sha }}
        run: docker build --quiet --build-arg SOURCE_COMMIT="$SHA" -t waf-base:release .
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - run: go vet ./... && go test ./...
      - run: tests/e2e/run.sh waf-base:release
      - run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
      - id: push
        name: Push sous le tag de travail pending, main-<sha> encore absent
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:main-$SHA" >/dev/null 2>"$RUNNER_TEMP/inspect.err"; then
            echo "$IMAGE:main-$SHA existe déjà : un re-run ne réécrit pas une image publiée" >&2
            exit 1
          elif ! grep -q 'not found' "$RUNNER_TEMP/inspect.err"; then
            cat "$RUNNER_TEMP/inspect.err" >&2
            exit 1
          fi
          docker tag waf-base:release "$IMAGE:pending"
          docker push --quiet "$IMAGE:pending"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:pending" | cut -d@ -f2)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest inattendu : $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - id: main
        name: main-<sha> sur le digest attesté
        env:
          SHA: ${{ github.sha }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:main-$SHA" >/dev/null 2>"$RUNNER_TEMP/inspect.err"; then
            echo "$IMAGE:main-$SHA existe déjà : un re-run ne réécrit pas une image publiée" >&2
            exit 1
          elif ! grep -q 'not found' "$RUNNER_TEMP/inspect.err"; then
            cat "$RUNNER_TEMP/inspect.err" >&2
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:main-$SHA" "$IMAGE@$DIGEST"
          pushed=$(docker buildx imagetools inspect "$IMAGE:main-$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          [ "$pushed" = "$DIGEST" ] || { echo "$IMAGE:main-$SHA pointe sur $pushed au lieu de $DIGEST" >&2; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  main:
    needs: build
    runs-on: ubuntu-24.04
    environment: build
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
      - name: Tag flottant main, seulement vers un commit qui descend du sien
        env:
          SHA: ${{ github.sha }}
          DIGEST: ${{ needs.build.outputs.digest }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest inattendu : $DIGEST" >&2; exit 1; }
          if cur=$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Manifest}}' 2>"$RUNNER_TEMP/inspect.err" | jq -r .digest); then
            [[ "$cur" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest de $IMAGE:main inattendu : $cur" >&2; exit 1; }
            docker buildx imagetools inspect --raw "$IMAGE@$cur" > "$RUNNER_TEMP/main.json"
            [ "sha256:$(sha256sum "$RUNNER_TEMP/main.json" | cut -d' ' -f1)" = "$cur" ] || { echo "manifeste de $IMAGE:main illisible" >&2; exit 1; }
            commits=$(gh attestation verify "$RUNNER_TEMP/main.json" --repo "$REPO" --signer-workflow "$SIGNER" \
              --source-ref refs/heads/main --deny-self-hosted-runners --format json \
              --jq '[.[].verificationResult.signature.certificate.sourceRepositoryDigest] | unique | join(" ")')
            [[ "$commits" =~ ^[0-9a-f]{40}$ ]] || { echo "commit de $IMAGE:main introuvable dans son attestation : $commits" >&2; exit 1; }
            status=$(gh api "repos/$REPO/compare/$commits...$SHA" --jq .status)
            case "$status" in
              ahead|identical) ;;
              behind)
                echo "::notice::$IMAGE:main désigne $commits, plus récent que $SHA : tag laissé en place"
                exit 0 ;;
              *)
                echo "$IMAGE:main désigne $commits, $status par rapport à $SHA" >&2
                exit 1 ;;
            esac
          elif ! grep -q 'not found' "$RUNNER_TEMP/inspect.err"; then
            cat "$RUNNER_TEMP/inspect.err" >&2
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:main" "$IMAGE@$DIGEST"

  release:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions: {}
    outputs:
      created: ${{ steps.release-please.outputs.release_created }}
      tag: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  semver:
    needs: [build, release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    environment: build
    permissions:
      contents: read
      pull-requests: read
      packages: write
      attestations: read
    steps:
      - run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
      - name: Tag de version sur l'image attestée du commit de la dernière release
        env:
          CREATED: ${{ needs.release.outputs.created }}
          CREATED_TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! TAG=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>"$RUNNER_TEMP/latest.err"); then
            if grep -q 'HTTP 404' "$RUNNER_TEMP/latest.err"; then echo "aucune release"; exit 0; fi
            cat "$RUNNER_TEMP/latest.err" >&2
            exit 1
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag de release inattendu : $TAG" >&2; exit 1; }
          if [ "$CREATED" = true ] && [ "$TAG" != "$CREATED_TAG" ]; then
            echo "release créée : $CREATED_TAG, dernière release : $TAG" >&2
            exit 1
          fi
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          [[ "$ref" =~ ^commit\ [0-9a-f]{40}$ ]] || { echo "$TAG ne désigne pas un commit : $ref" >&2; exit 1; }
          SHA=${ref#commit }
          prs=$(gh api "repos/$REPO/commits/$SHA/pulls" | jq --arg sha "$SHA" \
            '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main" and .head.ref == "release-please--branches--main")] | length')
          [ "$prs" = 1 ] || { echo "$TAG ($SHA) n'est pas la fusion d'une PR de release-please" >&2; exit 1; }
          if ! digest=$(docker buildx imagetools inspect "$IMAGE:main-$SHA" --format '{{json .Manifest}}' 2>"$RUNNER_TEMP/inspect.err" | jq -r .digest); then
            grep -q 'not found' "$RUNNER_TEMP/inspect.err" || { cat "$RUNNER_TEMP/inspect.err" >&2; exit 1; }
            if [ "$CREATED" = true ]; then
              echo "::error::$IMAGE:main-$SHA absente : relancer le run du commit $SHA (README, Incidents de publication)"
              exit 1
            fi
            echo "::warning::$TAG sans image : $IMAGE:main-$SHA absente (README, Incidents de publication)"
            exit 0
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest inattendu : $digest" >&2; exit 1; }
          if existing=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' 2>"$RUNNER_TEMP/inspect.err" | jq -r .digest); then
            if [ "$existing" != "$digest" ]; then
              echo "$IMAGE:$TAG existe déjà sur $existing : un re-run ne réécrit pas une version publiée" >&2
              exit 1
            fi
            echo "$IMAGE:$TAG déjà posé sur $digest"
            exit 0
          elif ! grep -q 'not found' "$RUNNER_TEMP/inspect.err"; then
            cat "$RUNNER_TEMP/inspect.err" >&2
            exit 1
          fi
          docker buildx imagetools inspect --raw "$IMAGE@$digest" > "$RUNNER_TEMP/manifest.json"
          [ "sha256:$(sha256sum "$RUNNER_TEMP/manifest.json" | cut -d' ' -f1)" = "$digest" ] || { echo "manifeste de $IMAGE@$digest illisible" >&2; exit 1; }
          gh attestation verify "$RUNNER_TEMP/manifest.json" --repo "$REPO" --signer-workflow "$SIGNER" \
            --source-ref refs/heads/main --source-digest "$SHA" --deny-self-hosted-runners
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$TAG" "$IMAGE@$digest"
          pushed=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          [ "$pushed" = "$digest" ] || { echo "$IMAGE:$TAG pointe sur $pushed au lieu de $digest" >&2; exit 1; }
