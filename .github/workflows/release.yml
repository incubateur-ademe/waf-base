name: release
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
concurrency:
  group: release
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/incubateur-ademe/waf-base
jobs:
  build:
    runs-on: ubuntu-24.04
    environment: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - run: go vet ./... && go test ./...
      - name: Build et test de bout en bout de l'image publiée
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build --quiet --build-arg SOURCE_COMMIT="$SHA" -t waf-base:release .
          tests/e2e/run.sh waf-base:release
      - run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - id: push
        env:
          RUN: ${{ github.run_number }}
        run: |
          if docker manifest inspect "$IMAGE:v1.$RUN" >/dev/null 2>&1; then
            echo "$IMAGE:v1.$RUN existe déjà : un re-run ne réécrit pas une version publiée" >&2
            exit 1
          fi
          docker tag waf-base:release "$IMAGE:v1.$RUN"
          docker push --quiet "$IMAGE:v1.$RUN"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:v1.$RUN" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Tag flottant v1, une fois l'attestation posée
        env:
          RUN: ${{ github.run_number }}
        run: |
          docker tag waf-base:release "$IMAGE:v1"
          docker push --quiet "$IMAGE:v1"
