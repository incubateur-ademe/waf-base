name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t waf-base:ci .
      - run: tests/e2e/run.sh waf-base:ci
      - run: docker build -f ops/Dockerfile -t waf-ops:ci .
      - name: wafgen ops et provision sans variables sortent en erreur, sans réseau
        run: |
          set +e
          out="$(docker run --rm --network none waf-ops:ci 2>&1)"
          rc=$?
          prov="$(docker run --rm --network none waf-ops:ci /usr/bin/wafgen provision 2>&1)"
          rcp=$?
          set -e
          echo "$out"
          echo "$prov"
          test "$rc" -ne 0
          test "$rcp" -ne 0
          grep -q "variables manquantes : COOLIFY_URL, COOLIFY_TOKEN, WAF_OPS_STAGES, WAF_OPS_FGP, WAF_OPS_FGP_KEY, WAF_OPS_PULSE_URL" <<<"$out"
          grep -q "variables manquantes : COOLIFY_URL, COOLIFY_TOKEN" <<<"$prov"
  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Aucun déclencheur pull_request_target ni workflow_run
        run: "! grep -rnE '^[[:space:]]*(pull_request_targe[t]|workflow_ru[n])[[:space:]]*:' .github/workflows/"
      - name: Config release-please lisible
        run: jq empty release-please-config.json .release-please-manifest.json
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
