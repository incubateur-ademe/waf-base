# Server Actions Next.js : corps JSON envoyé en text/plain
SecRule &REQUEST_HEADERS:Next-Action "@gt 0" \
    "id:31001,phase:1,pass,nolog,t:none,\
    ctl:requestBodyProcessor=JSON,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |application/json| |text/plain|'"

# Éditeur riche des admins : HTML saisi dans json.content
SecRule REQUEST_FILENAME "@beginsWith /api/admin/articles/" \
    "id:31010,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveTargetById=941000-941999;ARGS:json.content"

# Callback OIDC ProConnect, utile en PL 2 : code pris pour un commentaire SQL (942440)
SecRule REQUEST_FILENAME "@streq /api/auth/callback" \
    "id:31020,phase:1,pass,nolog,t:none,ctl:ruleRemoveById=942440"
