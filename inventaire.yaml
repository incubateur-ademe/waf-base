# Apps protégées, modifiable par ops seulement (CODEOWNERS). Section 5.7 du design.
# canonical: <host>, optionnel, un des hosts de l'app, jamais dans defaults : ses autres hosts y sont redirigés en 301 (Cache-Control max-age=86400), après le WAF.
# edge: cloudflare, optionnel, jamais dans defaults : si X-Ademe-Edge porte la variable d'équipe EDGE_SECRET_<APP> (à créer par ops), l'IP du visiteur est lue dans CF-Connecting-IP.
defaults:
  ceilings: { events_per_second: 100, upload_max_size: 100MiB, detection_only_max_days: 14 }
  host_header: visitor
  branch: main
  resources: { memory: 512M, cpu_weight: 64 }
  waf_dir: waf
  internal_events: 0
apps:
  tacct:
    repo: incubateur-ademe/tacct
    platform: scalingo
    hosts: [tacct.ademe.fr, www.tacct.ademe.fr, facili-tacct.beta.gouv.fr, www.facili-tacct.beta.gouv.fr]
    canonical: tacct.ademe.fr
    edge: cloudflare
    host_header: upstream
    crs_plugins: []
    live: true
  tacct-preprod:
    repo: incubateur-ademe/tacct
    platform: scalingo
    hosts: [tacct.incubateur.ademe.dev, facili-tacct.incubateur.ademe.dev, preprod.tacct.ademe.fr]
    edge: cloudflare
    host_header: upstream
    crs_plugins: []
    live: true
  waf-pilote:
    repo: incubateur-ademe/waf-pilote
    platform: scalingo
    hosts: [waf-pilote.incubateur.ademe.dev]
    host_header: visitor
    crs_plugins: []
    live: true
